name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Backend tests
        run: npm test

      - name: Typecheck dashboard
        run: npm run typecheck

      - name: Build dashboard
        run: npm run build
